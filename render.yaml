services:
  # 1. ProofMind AI - FastAPI Backend Service
  - type: web
    name: proofmind-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        value: "*"
      - key: STORAGE_DIR
        value: "./storage"
    healthCheckPath: /health
    # Note: On Render Free tier, local storage is ephemeral between service restarts.
    # To add persistent disk (requires Render Starter plan), uncomment below:
    # disk:
    #   name: proofmind-storage
    #   mountPath: /var/data/storage
    #   sizeGB: 1

  # 2. ProofMind AI - React Vite Frontend Static Site
  - type: web
    name: proofmind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: proofmind-backend
          property: host
